name: daily

# 每天 00:00（北京时间 = UTC 16:00）自动抓取最近 24 小时更新的内容
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      PICA_DL_RECENT_HOURS:
        description: '往回抓多少小时（默认 24；补档填 72/168）'
        required: false
        default: '24'
      PICA_DL_EXCLUDE_CATEGORIES:
        description: '排除的分区（逗号分隔）'
        required: false
        default: ''

env:
  PICA_IN_GITHUB: true
  PICA_ACCOUNT: ${{ secrets.PICA_ACCOUNT }}
  PICA_PASSWORD: ${{ secrets.PICA_PASSWORD }}
  PICA_DL_CONTENT: recent
  PICA_DL_BLOCK: ''
  PICA_DL_RECENT_HOURS: ${{ github.event.inputs.PICA_DL_RECENT_HOURS || '24' }}
  # 过滤：生肉 + 女性向 + 偽娘哲學 + CG雜圖 + 扶他樂園 + 耽美花園
  PICA_DL_EXCLUDE_CATEGORIES: ${{ github.event.inputs.PICA_DL_EXCLUDE_CATEGORIES || '生肉,女性向,偽娘哲學,CG雜圖,扶他樂園,耽美花園' }}
  PICA_DL_DROP_RAW: 'true'
  # 严格模式：把「没有汉化组」也当生肉。默认关，否则 Cosplay/写真/CG 集会被全灭
  PICA_DL_RAW_STRICT: 'false'
  # 打印被过滤明细，方便排查「怎么更新这么少」
  PICA_DL_DEBUG_DROPS: 'true'
  PICA_DL_INCLUDE_CATEGORIES: ''
  PICA_DL_LIMIT: ''
  PICA_DL_CHAPTER: '全部'
  PICA_DL_FAV_PAGE: '全部'
  PICA_DL_SEARCH_KEYWORDS: ''

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps and build
        run: |
          pnpm install
          pnpm run build

      - name: Download
        run: pnpm start

      - name: Compress
        run: pnpm start:zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-comics
          path: comics-zip/
          retention-days: 7
